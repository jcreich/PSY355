  app.appendChild(grid);
}

function renderSectionView(app) {
  const backRow = document.createElement("div");
  backRow.className = "back-row";
  const backBtn = document.createElement("button");
  backBtn.className = "back-btn";
  backBtn.textContent = "\u2190 Back to all sections";
  backBtn.addEventListener("click", () => { currentSection = null; renderApp(); window.scrollTo(0,0); });
  backRow.appendChild(backBtn);
  app.appendChild(backRow);

  const hasAssignment = !!SECTIONS[currentSection].assignmentTitle;
  if (currentTab === "assignment" && !hasAssignment) { currentTab = "guide"; }

  const tabs = document.createElement("div");
  tabs.className = "tabs";
  const tabList = [["guide", "Writing Guide"], ["practice", "Annotation Practice"]];
  if (hasAssignment) { tabList.push(["assignment", "Assignment"]); }
  tabList.forEach(pair => {
    const key = pair[0], label = pair[1];
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (currentTab === key ? " active" : "");
    btn.textContent = label;
    btn.addEventListener("click", () => { currentTab = key; renderApp(); });
    tabs.appendChild(btn);
  });
  app.appendChild(tabs);

  const content = document.createElement("div");
  app.appendChild(content);

  if (currentTab === "guide") {
    if (currentSection === "introduction") renderGuideIntroduction(content);
    else if (currentSection === "method") renderGuideMethod(content);
    else if (currentSection === "results") renderGuideResults(content);
    else if (currentSection === "discussion") renderGuideDiscussion(content);
    else if (currentSection === "titleabstract") renderGuideTitleAbstract(content);
  } else if (currentTab === "practice") {
    renderPractice(content);
  } else if (hasAssignment) {
    renderAssignment(content);
  }
}

function renderGuideIntroduction(container) {
  container.innerHTML = "" +
    '<p style="line-height:1.6;">A scientific introduction is not an essay, a report, or a summary. It is an argument \u2014 and its job is to bring the reader to your hypotheses by a logical path. Building one from scratch takes practice, and it\u2019s normal for it to be the hardest section to write well.</p>' +

    '<div class="callout-box req-table"><strong>Quick reference \u2014 RR1 Introduction Draft (Assignment 4):</strong>' +
    '<table><tbody>' +
    '<tr><td><strong>Length</strong></td><td>600&ndash;900 words (introduction text only, not counting references)</td></tr>' +
    '<tr><td><strong>Format</strong></td><td>Double-spaced, 12pt Times New Roman, 1-inch margins, APA 7th edition</td></tr>' +
    '<tr><td><strong>Sources</strong></td><td>At least 4 peer-reviewed journal articles cited in-text</td></tr>' +
    '<tr><td><strong>Hypotheses</strong></td><td>At least one directional, labeled hypothesis (H1, H2&hellip;) at the end</td></tr>' +
    '</tbody></table></div>' +

    '<h3 class="guide-h">What an Introduction Does</h3>' +
    '<div class="guide-body">' +
    '<p>By the end of your introduction, a reader who knows nothing about your topic should understand:</p>' +
    '<ul>' +
    '<li>Why your topic matters as a research area</li>' +
    '<li>What your chosen variables are and why researchers study them</li>' +
    '<li>What the literature says about the relationship between your variables</li>' +
    '<li>Why your study is worth doing</li>' +
    '<li>What you specifically predict</li>' +
    '</ul>' +
    '<p>Everything in your introduction should serve one of those five purposes. If a sentence doesn\u2019t move the reader toward your hypotheses, it probably doesn\u2019t belong.</p>' +
    '</div>' +
    '<div class="warn-box">\u26A0\uFE0F <strong>The most common issue \u2014 summaries vs. arguments:</strong> Most first introductions read like a list of article summaries rather than an argument. Each paragraph describes one study, then the next paragraph describes another, with no thread connecting them. The fix: decide what point you\u2019re making, then use the studies as evidence for that point, not as the point itself.</div>' +

    '<h3 class="guide-h">Suggested Structure</h3>' +
    '<div class="guide-body">' +
    '<p>There\u2019s no single correct template, but most strong introductions move from broad to specific:</p>' +
    '<table><thead><tr><th>Movement</th><th>What It Accomplishes</th></tr></thead><tbody>' +
    '<tr><td><strong>Open with context</strong></td><td>Establish why the topic matters. This might be one paragraph or a few sentences \u2014 do what the topic warrants.</td></tr>' +
    '<tr><td><strong>Introduce your constructs</strong></td><td>Define and contextualize your key variables. What is each one? How has it been studied?</td></tr>' +
    '<tr><td><strong>Connect the variables</strong></td><td>Bring your variables together. What does the literature say about their relationship? Where are the gaps or contradictions?</td></tr>' +
    '<tr><td><strong>State your hypotheses</strong></td><td>End with specific, directional predictions \u2014 each should feel like the logical conclusion of everything you just argued.</td></tr>' +
    '</tbody></table>' +
    '<p style="font-size:13px; color:#666; margin-top:8px;">These are movements, not mandatory paragraphs. "Introduce your constructs" might take one paragraph or three depending on your topic \u2014 let your argument drive the structure.</p>' +
    '</div>' +

    '<h3 class="guide-h">The Closing Move: Justifying Your Study</h3>' +
    '<div class="guide-body">' +
    '<p>The transition from "here is what we know" to "here is what we predict" needs to give the reader a reason to care about your specific study. Not every study needs a literature "gap" \u2014 examining a well-established relationship in a new sample is a legitimate purpose too. Choose the framing that honestly reflects what your study is doing:</p>' +
    '<table><thead><tr><th>Type of Closing Move</th><th>Example Language</th></tr></thead><tbody>' +
    '<tr><td><strong>Replication in a new sample</strong><br>Prior work exists mostly in specific populations; you\u2019re testing it in a new one.</td><td><em>"Although this relationship has been documented in [population], less is known about whether it holds among college students. The present study examined&hellip;"</em></td></tr>' +
    '<tr><td><strong>Replication with a different measure</strong><br>Prior studies used varied operationalizations; yours enables direct comparison.</td><td><em>"Prior studies have used varied measures of aggression, making comparisons difficult. The present study used the Buss-Perry Aggression Questionnaire to allow direct comparison with&hellip;"</em></td></tr>' +
    '<tr><td><strong>Extension to a related construct</strong><br>The literature examined one construct; yours examines a broader or related one.</td><td><em>"While prior research has focused primarily on physical aggression, the present study examined trait aggression more broadly&hellip;"</em></td></tr>' +
    '<tr><td><strong>Addressing mixed findings</strong><br>The literature is inconsistent; your study adds another data point.</td><td><em>"Given the inconsistency in prior findings, the present study sought to further examine the relationship between [X] and trait aggression&hellip;"</em></td></tr>' +
    '<tr><td><strong>Identifying a genuine gap</strong><br>Only if the literature truly leaves something unexamined &mdash; <u>don\u2019t force a gap that isn\u2019t there</u>.</td><td><em>"To date, no study has examined the relationship between [X] and trait aggression in [specific context]. The present study addressed this gap by&hellip;"</em></td></tr>' +
    '</tbody></table>' +
    '</div>' +
    '<div class="tip-box">\uD83D\uDCCC <strong>Honesty over creativity here:</strong> A straightforward replication stated clearly is stronger than a forced "gap" that doesn\u2019t really exist. Instructors (and reviewers) can tell the difference.</div>' +

    '<h3 class="guide-h">Building the Body: Broad to Narrow</h3>' +
    '<div class="guide-body">' +
    '<p>Use transition sentences to create cohesion between studies rather than jumping abruptly from one to the next. Two ways to organize your review:</p>' +
    '<ul>' +
    '<li><strong>One paragraph per source</strong>, when each study covers a different but connected concept, linked with transitions.</li>' +
    '<li><strong>Topical paragraphs</strong>, combining multiple sources that address the same concept.</li>' +
    '</ul>' +
    '<p>As you write, ask yourself: <em>What point am I making in this paragraph? Why does this source belong here? How does this paragraph connect to the next one? Am I leading with the point or leading with the citation?</em></p>' +
    '</div>' +
    '<div class="two-col">' +
    '<div class="example-card weak"><span class="ex-label">Fragmented (avoid this)</span>Bandura et al. (1996) found that moral disengagement was related to aggression in adolescents. Moore et al. (2012) examined moral disengagement in workplace settings and found it predicted unethical behavior. Thornberg and Jungert (2014) also found a link between moral disengagement and bullying.</div>' +
    '<div class="example-card good"><span class="ex-label">Cohesive (aim for this)</span>A consistent pattern in the literature links higher levels of moral disengagement to greater engagement in harmful and antisocial behavior across a range of contexts, including physical aggression (Bandura et al., 1996), workplace misconduct (Moore et al., 2012), and peer bullying (Thornberg &amp; Jungert, 2014).</div>' +
    '</div>' +
    '<p style="font-size:13px; color:#666; margin-top:8px;">The fragmented version is three separate summaries with no argument connecting them. The cohesive version states one clear claim first, then groups the citations together as evidence for it.</p>' +

    '<h3 class="guide-h">Using Sources Well</h3>' +
    '<div class="guide-body">' +
    '<ul>' +
    '<li>Paraphrase, don\u2019t quote. Avoid direct quotes almost entirely; if unavoidable, cite with a page number.</li>' +
    '<li>Every claim that isn\u2019t your own original idea needs a citation.</li>' +
    '</ul>' +
    '<table><thead><tr><th>Situation</th><th>Format</th><th>Example</th></tr></thead><tbody>' +
    '<tr><td>One author</td><td>(Author, Year) or Author (Year)</td><td><em>(Smith, 2020) or Smith (2020) found that&hellip;</em></td></tr>' +
    '<tr><td>Two authors</td><td>(Author &amp; Author, Year)</td><td><em>(Jones &amp; Lee, 2019)</em></td></tr>' +
    '<tr><td>Three or more authors</td><td>(First Author et al., Year)</td><td><em>(Brown et al., 2021)</em></td></tr>' +
    '<tr><td>Two sources, same point</td><td>Alphabetical order, separated by semicolon</td><td><em>(Brown et al., 2021; Jones &amp; Lee, 2019)</em></td></tr>' +
    '<tr><td>Author\u2019s name in the sentence</td><td>Author (Year) verb&hellip;</td><td><em>Smith (2020) found that&hellip;</em></td></tr>' +
    '<tr><td>Citing a specific finding</td><td>(Author, Year) at the end, before the period</td><td><em>&hellip;higher aggression scores (Smith, 2020).</em></td></tr>' +
    '</tbody></table>' +
    '<p style="margin-top:10px;"><strong>Common citation errors to avoid:</strong> writing out all authors every time instead of "et al."; using "&amp;" inside a sentence instead of "and"; missing the year; citing at the start of every single sentence; citing sources you didn\u2019t actually read.</p>' +
    '</div>' +

    '<h3 class="guide-h">Worked Example (Annotated)</h3>' +
    '<div class="guide-body"><p>This paragraph is about moral disengagement and aggression &mdash; a topic outside your variable set, so you can\u2019t use it directly. Read it as an illustration of the techniques above in action.</p></div>' +
    '<div class="annotated-example"><p>' +
    'Aggressive behavior is not always impulsive. In many cases, individuals engage in deliberate harm while maintaining a positive self-image, a process made possible by what Bandura (1999) termed moral disengagement.<span class="callout-num">1</span> ' +
    'Moral disengagement refers to a set of cognitive mechanisms through which people selectively deactivate their internal moral standards, allowing them to act harmfully without experiencing guilt or self-censure.<span class="callout-num">2</span> ' +
    'These mechanisms include moral justification, displacement of responsibility, and dehumanization of victims. ' +
    'Research has consistently linked higher levels of moral disengagement to greater engagement in aggressive and antisocial behavior across a range of contexts,<span class="callout-num">3</span> including workplace aggression (Moore et al., 2012), bullying and peer victimization (Thornberg &amp; Jungert, 2014), and physical violence (Bandura et al., 1996).<span class="callout-num">4</span> ' +
    'Despite this evidence, most studies have examined moral disengagement in relation to specific behavioral outcomes rather than trait-level aggression as a stable individual difference, leaving open the question of whether individuals who habitually disengage morally also report higher levels of generalized aggressiveness.<span class="callout-num">5</span>' +
    '</p>' +
    '<table><thead><tr><th>#</th><th>What It Does</th><th>Why It Works</th></tr></thead><tbody>' +
    '<tr><td><span class="callout-num">1</span></td><td>Opens with a claim, not a citation</td><td>The paragraph starts with an assertion. The citation appears after the claim is introduced, not before.</td></tr>' +
    '<tr><td><span class="callout-num">2</span></td><td>Defines the construct precisely</td><td>The term is defined in the writer\u2019s own words immediately after it\u2019s introduced. No direct quote.</td></tr>' +
    '<tr><td><span class="callout-num">3</span></td><td>Makes a claim, then uses citations as evidence</td><td>The sentence states what the literature shows first. Citations follow as support, not as the subject.</td></tr>' +
    '<tr><td><span class="callout-num">4</span></td><td>Groups multiple citations for one point</td><td>Three studies are cited together to support a single claim, not summarized one by one.</td></tr>' +
    '<tr><td><span class="callout-num">5</span></td><td>Identifies the gap</td><td>The paragraph ends by noting what the literature hasn\u2019t done, setting up the current study as the logical next step.</td></tr>' +
    '</tbody></table>' +
    '</div>' +

    '<h3 class="guide-h">Stating Your Hypotheses</h3>' +
    '<div class="guide-body">' +
    '<p>Your introduction should end with hypotheses that follow logically from everything you\u2019ve argued. A strong hypothesis at this stage is:</p>' +
    '<ul><li><strong>Specific</strong> &mdash; names the variables and the relationship, not just "a relationship"</li>' +
    '<li><strong>Directional</strong> &mdash; states which way the relationship goes</li>' +
    '<li><strong>Earned</strong> &mdash; follows from the literature you just reviewed, not out of nowhere</li>' +
    '<li><strong>Revised if needed</strong> &mdash; it\u2019s fine for your prediction to change as your literature search continues</li></ul>' +
    '<p>Label each hypothesis (H1, H2&hellip;) and write it as a complete sentence. Two common ways to present them:</p>' +
    '</div>' +
    '<div class="two-col">' +
    '<div class="example-card good"><span class="ex-label">Option 1 (recommended) &mdash; prose, label in parentheses</span>The present study examined two hypotheses. First, it was predicted that higher levels of moral disengagement would be positively associated with trait aggression (H1). Second, it was hypothesized that this relationship would be strongest for the hostility subscale of the BPAQ (H2).</div>' +
    '<div class="example-card good"><span class="ex-label">Option 2 (acceptable) &mdash; lead sentence with colon</span>The present study had two hypotheses: H1: Higher levels of moral disengagement would be positively associated with trait aggression. H2: This relationship would be strongest for the hostility subscale of the BPAQ.</div>' +
    '</div>' +
    '<p style="font-size:13px; color:#666; margin-top:8px;">Option 1 matches how hypotheses appear in most published articles and reads more naturally in a short paper. Option 2 works better in longer papers where hypotheses get referenced by number throughout &mdash; it can feel stilted in a short one. Whichever you choose, stay consistent: use the same labels when you refer back to them in Results and Discussion.</p>' +

    '<div class="tip-box">\uD83D\uDCCC Don\u2019t stare at a blank page. Write what you know and let the words flow \u2014 it\u2019s okay to "word vomit" a rough version and clean it up later. Save real editing time for a separate pass. Cut and rearrange freely; moving paragraphs around while drafting is completely normal.</div>';
}

function renderGuideMethod(container) {
  container.innerHTML = "" +
    '<p style="line-height:1.6;">The Method section is the blueprint of your study. Its purpose is simple: give the reader enough information to replicate your study exactly. The gold standard is <strong>replication</strong> &mdash; another researcher should be able to repeat what you did using only your description.</p>' +

    '<div class="callout-box req-table"><strong>Quick reference \u2014 Writing a Method Section (Assignment 7b):</strong>' +
    '<table><tbody>' +
    '<tr><td><strong>Format</strong></td><td>Method section only (no title page/abstract); 12pt Times New Roman, double-spaced, 1-inch margins</td></tr>' +
    '<tr><td><strong>Subsections</strong></td><td>Participants, Measures, Procedure &mdash; each with a bold APA heading</td></tr>' +
    '<tr><td><strong>Measures</strong></td><td>One paragraph per measure, in the order participants completed them, each with a bold italic subheading</td></tr>' +
    '<tr><td><strong>References</strong></td><td>Include a References section for any sources cited in Measures</td></tr>' +
    '</tbody></table></div>' +

    '<h3 class="guide-h">Three Key Parts</h3>' +
    '<div class="guide-body">' +
    '<ul>' +
    '<li><strong>Participants</strong> \u2014 who was in your study</li>' +
    '<li><strong>Measures</strong> \u2014 what instruments participants completed (sometimes split into a separate <strong>Materials</strong> subsection for equipment, stimuli, or computer programs \u2014 not every study needs one)</li>' +
    '<li><strong>Procedure</strong> \u2014 what happened, in order</li>' +
    '</ul>' +
    '<p style="font-size:13px; color:#666;">Note: human participants are called <strong>participants</strong>; animals are called <strong>subjects</strong>.</p>' +
    '</div>' +

    '<h3 class="guide-h">Writing the Participants Subsection</h3>' +
    '<div class="guide-body"><p>Write in paragraph form, not as a list. State the total <em>N</em> first, then work through the rest.</p>' +
    '<table><thead><tr><th>Element</th><th>What to Write</th><th>Example</th></tr></thead><tbody>' +
    '<tr><td><strong>Sample size</strong></td><td>State the total <em>N</em> first</td><td><em>A total of 78 individuals participated in the study.</em></td></tr>' +
    '<tr><td><strong>Recruitment</strong></td><td>How and where recruited; any compensation</td><td><em>Participants were recruited from introductory psychology courses and received course credit.</em></td></tr>' +
    '<tr><td><strong>Age</strong></td><td><em>M</em>, <em>SD</em>, and range</td><td><em>Participants ranged in age from 18 to 27 years (M = 19.84, SD = 1.63).</em></td></tr>' +
    '<tr><td><strong>Gender</strong></td><td>Percentages per category; note transgender identification separately</td><td><em>The sample included 65% women, 31% men, and 4% nonbinary participants. No participants identified as transgender.</em></td></tr>' +
    '<tr><td><strong>Race/Ethnicity</strong></td><td>Percentage per category reported</td><td><em>Most participants identified as White (68%), followed by Black (14%)&hellip;</em></td></tr>' +
    '</tbody></table></div>' +
    '<div class="tip-box">\uD83D\uDCCC <strong>Which variables to report:</strong> report every demographic variable you collected \u2014 if you asked about it, readers expect to see it. Always use the language participants used to describe themselves; don\u2019t recode or relabel identity categories without a methodological reason.</div>' +

    '<h3 class="guide-h">Reference Guide: Other Demographic Variables</h3>' +
    '<div class="guide-body"><p>Different studies collect different demographics. Same pattern applies: frequencies/percentages for categorical variables, <em>M</em>/<em>SD</em> for continuous ones.</p>' +
    '<table><thead><tr><th>Variable</th><th>How to Report</th></tr></thead><tbody>' +
    '<tr><td><strong>Sexual orientation</strong></td><td>Frequencies/percentages using participants\u2019 own labels, not your own categories</td></tr>' +
    '<tr><td><strong>Relationship status</strong></td><td>Frequencies/percentages; collapse categories if cell sizes are very small</td></tr>' +
    '<tr><td><strong>Education level</strong></td><td>Frequencies/percentages; for college samples, year in school is typically more informative</td></tr>' +
    '<tr><td><strong>Employment status</strong></td><td>Frequencies/percentages; relevant for work-related constructs or non-student samples</td></tr>' +
    '<tr><td><strong>Income / SES</strong></td><td>Frequencies/percentages by bracket, or <em>M</em>/<em>SD</em> if measured continuously</td></tr>' +
    '<tr><td><strong>Nationality / country of origin</strong></td><td>Frequencies/percentages; relevant for cross-cultural work or international samples</td></tr>' +
    '<tr><td><strong>Diagnosis / clinical status</strong></td><td>Frequencies/percentages; use person-first language unless the community prefers identity-first</td></tr>' +
    '<tr><td><strong>Continuous variables</strong> (e.g., years of experience)</td><td><em>M</em> and <em>SD</em>, with range if informative &mdash; treat like age</td></tr>' +
    '</tbody></table></div>' +

    '<h3 class="guide-h">Writing the Measures Subsection</h3>' +
    '<div class="guide-body"><p>List every measure participants completed, in the order they appeared in the survey. Each gets its own paragraph with a <strong><em>bold italic</em></strong> subheading (e.g., <strong><em>Demographics</em></strong>, <strong><em>Aggression</em></strong>, <strong><em>[Your Variable]</em></strong>). Demographics is usually listed first or last.</p>' +
    '<p>Each measure paragraph needs:</p>' +
    '<ul>' +
    '<li>Source/citation</li>' +
    '<li>An example item with the response scale</li>' +
    '<li>How scores were combined (averaged/summed)</li>' +
    '<li>What higher/lower scores mean</li>' +
    '<li>Descriptives (<em>M</em>, <em>SD</em>)</li>' +
    '<li>Reliability (Cronbach\u2019s alpha at minimum)</li>' +
    '</ul>' +
    '</div>' +
    '<div class="tip-box">\uD83D\uDCCC <strong>Incorporating your Assignment 5 descriptions:</strong> read your instructor\u2019s feedback and revise first; add <em>M</em>/<em>SD</em> placeholders where indicated (e.g., "(M = [your value], SD = [your value])"); and rewrite into Method-section prose \u2014 no first-person language, no bullet points, past tense where appropriate. Order should match the order participants completed the measures.</div>' +

    '<h3 class="guide-h">Writing the Procedure Subsection</h3>' +
    '<div class="guide-body"><p>Describe what participants actually did, in chronological order &mdash; a reader should be able to follow the sequence from the moment someone clicked the survey link to the moment they submitted it. Cover, in order:</p>' +
    '<ol><li>Study setting</li><li>Consent</li><li>Measure order (note randomization if used)</li><li>Duration</li><li>Compensation</li></ol>' +
    '<p style="font-size:13px; color:#666;">Also relevant if applicable: was deception used? Were participants or experimenters blind to conditions? Was a confederate involved? How were participants debriefed?</p>' +
    '</div>' +
    '<div class="annotated-example"><p><strong>Example Procedure paragraph:</strong><br>The study was conducted online via Qualtrics (https://www.qualtrics.com/). Before beginning, participants read an informed consent statement describing the study\u2019s purpose, the voluntary nature of participation, and the confidentiality of their responses. Participants then completed a series of self-report measures. The order of the measures was randomized via Qualtrics to minimize order effects. The survey took approximately 20 to 25 minutes to complete. Participants received course credit for their participation.</p></div>' +
    '<div class="warn-box">\u26A0\uFE0F <strong>Past tense throughout:</strong> the study has already happened from the reader\u2019s perspective &mdash; use "participants completed," not "participants will complete."</div>' +

    '<h3 class="guide-h">APA Heading Levels</h3>' +
    '<div class="guide-body"><p>At this level, you\u2019ll mostly use Levels 1&ndash;3:</p>' +
    '<table><thead><tr><th>Level</th><th>Format</th><th>Used For</th><th>Example</th></tr></thead><tbody>' +
    '<tr><td>Level 1</td><td>Centered, bold, title case. Text begins on a new line below.</td><td>Main sections (Introduction, Method, Results, Discussion)</td><td><strong>Method</strong></td></tr>' +
    '<tr><td>Level 2</td><td>Flush left, bold, title case. Text begins on a new line below.</td><td>Subsections within a section</td><td><strong>Participants</strong>, <strong>Measures</strong>, <strong>Procedure</strong></td></tr>' +
    '<tr><td>Level 3</td><td>Flush left, bold italic, title case. Text begins on a new line below.</td><td>Individual measure names within Measures</td><td><strong><em>Aggression</em></strong></td></tr>' +
    '</tbody></table>' +
    '<p style="margin-top:10px;"><strong>Common heading mistakes:</strong> using all caps; underlining or adding a colon; starting text on the same line as a heading; inconsistent formatting across headings of the same level; using bold (not bold italic) for measure names.</p>' +
    '</div>' +

    '<div class="annotated-example"><p style="text-align:center; font-weight:bold; margin-bottom:10px;">How a correctly formatted Method section opening looks:</p>' +
    '<p style="text-align:center; font-weight:bold; margin:0;">Method</p>' +
    '<p style="font-weight:bold; margin:10px 0 0;">Participants</p>' +
    '<p style="margin:4px 0 10px;">A total of 78 individuals participated in the study&hellip;</p>' +
    '<p style="font-weight:bold; margin:10px 0 0;">Measures</p>' +
    '<p style="font-weight:bold; font-style:italic; margin:8px 0 0;">Demographics</p>' +
    '<p style="margin:4px 0 10px;">Participants provided demographic information including age, gender identity&hellip;</p>' +
    '<p style="font-weight:bold; font-style:italic; margin:8px 0 0;">Aggression</p>' +
    '<p style="margin:4px 0 10px;">To measure trait aggressiveness, participants completed the Buss-Perry&hellip;</p>' +
    '<p style="font-weight:bold; margin:10px 0 0;">Procedure</p>' +
    '<p style="margin:4px 0 0;">The study was conducted online via&hellip;</p>' +
    '</div>' +

    '<div class="tip-box">\uD83D\uDCCC <strong>Tips &amp; tricks:</strong> It\u2019s "Method," not "Methods." This section starts right after the Introduction \u2014 no page break, no extra line spacing. No extra spacing between subsections either. And never put the same information in more than one subsection &mdash; if it\u2019s already in Measures, it doesn\u2019t need to repeat in Procedure.</div>';
}

function renderGuideResults(container) {
  container.innerHTML = "" +
    '<p style="line-height:1.6;">The Results section tells the reader how the data were analyzed and what was found. Start with simple statistics before more complicated ones, follow a systematic and predictable pattern, and include very little interpretation \u2014 that\u2019s saved for the Discussion. This is often the <strong>shortest</strong> section of your paper.</p>' +

    '<div class="callout-box req-table"><strong>Quick reference \u2014 Data Analysis + Results Draft (Assignment 8):</strong>' +
    '<table><tbody>' +
    '<tr><td><strong>Length</strong></td><td>Approximately 150&ndash;300 words, double-spaced, APA format</td></tr>' +
    '<tr><td><strong>Include</strong></td><td>Correlation(s); effect size interpretation; hypothesis outcome (supported/not supported); figure reference</td></tr>' +
    '<tr><td><strong>Rounding</strong></td><td>Two decimal places for all values except <em>p</em></td></tr>' +
    '<tr><td><strong>No raw output</strong></td><td>Never paste Jamovi screenshots or tables into your paper &mdash; extract the numbers and report them in your own APA-formatted sentences</td></tr>' +
    '</tbody></table></div>' +

    '<h3 class="guide-h">Formatting Basics</h3>' +
    '<div class="guide-body"><ul>' +
    '<li>Begins right after Method &mdash; no page break, no extra line spacing</li>' +
    '<li>"Results" is centered and boldface (Level 1 heading)</li>' +
    '<li>All statistical symbols (<em>M, SD, r, t, F, d, p</em>&hellip;) are italicized</li>' +
    '<li>Spaces around every equals sign: <em>M</em> = 1.43, not <em>M</em>=1.43</li>' +
    '<li>Report exact <em>p</em>-values when possible</li>' +
    '<li>Means are always accompanied by a measure of variability (usually <em>SD</em>)</li>' +
    '</ul></div>' +
    '<div class="warn-box">\u26A0\uFE0F <strong>Never write <em>p</em> = .000.</strong> A <em>p</em>-value of exactly zero is mathematically impossible. When Jamovi reports .000, write <em>p</em> &lt; .001 instead.</div>' +

    '<h3 class="guide-h">Reporting Results of Statistical Tests</h3>' +
    '<div class="guide-body">' +
    '<table><thead><tr><th>Test</th><th>Format</th><th>Example</th></tr></thead><tbody>' +
    '<tr><td>Correlation (Pearson\u2019s <em>r</em>)</td><td><em>r</em>(df) = #, <em>p</em> = #</td><td>A moderate, positive, significant correlation between GPA and SAT scores indicated that as SAT scores increase, so does GPA, <em>r</em>(56) = .52, <em>p</em> = .003.</td></tr>' +
    '<tr><td><em>t</em>-test (one-sample, paired, or independent)</td><td><em>t</em>(df) = #, <em>p</em> = #, <em>d</em> = #</td><td>Men (<em>M</em> = 1.33, <em>SD</em> = .77) and women (<em>M</em> = 1.45, <em>SD</em> = .79) did not significantly differ in their reported self-esteem, <em>t</em>(98) = 1.08, <em>p</em> = .45, <em>d</em> = .15.</td></tr>' +
    '<tr><td>ANOVA (one-way, repeated measures)</td><td><em>F</em>(df1, df2) = #, <em>p</em> = #, \u03b7\u00b2 = #</td><td>A one-way between-subjects ANOVA indicated significant differences in attitudes toward marijuana between the three political affiliations, <em>F</em>(2, 225) = 10.91, <em>p</em> &lt; .001, \u03b7\u00b2 = .07.</td></tr>' +
    '<tr><td>ANOVA (factorial: main effect, interaction)</td><td><em>F</em>(df1, df2) = #, <em>p</em> = #</td><td>The main effect of dose was marginally significant, <em>F</em>(2, 23) = 3.23, <em>p</em> = .07. However, the main effect of diagnosis was significant, <em>F</em>(3, 23) = 4.56, <em>p</em> = .04, but was qualified by a significant dosage by diagnosis interaction, <em>F</em>(6, 23) = 15.70, <em>p</em> &lt; .001.</td></tr>' +
    '</tbody></table>' +
    '<p style="font-size:13px; color:#666; margin-top:8px;">These are the tests we work with in this course. For other tests, check Canvas, the APA manual, or ask.</p>' +
    '</div>' +

    '<h3 class="guide-h">Additional APA Notation</h3>' +
    '<div class="guide-body">' +
    '<table><thead><tr><th>Situation</th><th>Format</th></tr></thead><tbody>' +
    '<tr><td>Descriptive statistics</td><td><em>M</em> = 2.41, <em>SD</em> = 0.63</td></tr>' +
    '<tr><td>Reliability</td><td>\u03b1 = .89 (Greek letter alpha, not italicized)</td></tr>' +
    '<tr><td>Significant correlation</td><td><em>r</em>(df) = .38, <em>p</em> = .001</td></tr>' +
    '<tr><td>Non-significant correlation</td><td><em>r</em>(df) = .08, <em>p</em> = .412</td></tr>' +
    '</tbody></table>' +
    '<p style="font-size:13px; color:#666; margin-top:8px;">Remember: <em>r</em> and <em>p</em> values drop the leading zero (.38, not 0.38) since they can\u2019t exceed 1.</p>' +
    '</div>' +

    '<h3 class="guide-h">Effect Size Conventions</h3>' +
    '<div class="guide-body">' +
    '<table><thead><tr><th>Weak</th><th>Moderate</th><th>Strong</th></tr></thead><tbody>' +
    '<tr><td><em>r</em> &lt; .10</td><td>.10 &le; <em>r</em> &lt; .50</td><td><em>r</em> &ge; .50</td></tr>' +
    '</tbody></table></div>' +
    '<div class="warn-box">\u26A0\uFE0F <strong>Proved vs. supported:</strong> Never say your results "proved" or "disproved" a hypothesis. Results either <strong>support</strong> or <strong>do not support</strong> a hypothesis. A non-significant result doesn\u2019t mean the relationship doesn\u2019t exist \u2014 only that your study didn\u2019t detect it.</div>' +

    '<h3 class="guide-h">Conditional Language Templates</h3>' +
    '<div class="guide-body"><p>Fill in the blanks with your own values:</p></div>' +
    '<div class="two-col">' +
    '<div class="example-card good"><span class="ex-label">If significant (p &lt; .05)</span>Consistent with H[#], a Pearson\u2019s correlation revealed a significant, [positive/negative], [weak/moderate/strong] relationship between [VARIABLE] and trait aggression, <em>r</em>([df]) = [r], <em>p</em> = [p]. This relationship is illustrated in Figure #.</div>' +
    '<div class="example-card good"><span class="ex-label">If non-significant (p &gt; .05)</span>Contrary to H[#], a Pearson\u2019s correlation indicated no significant relationship between [VARIABLE] and trait aggression, <em>r</em>([df]) = [r], <em>p</em> = [p]. This relationship is illustrated in Figure #.</div>' +
    '</div>' +
    '<p style="font-size:13px; color:#666; margin-top:8px;">For multiple correlations (e.g., two variables or subscales), introduce them together first, then report each with its own hypothesis label: "Pearson\u2019s correlations were computed to examine the relationships between trait aggression and [VARIABLE 1] and [VARIABLE 2]. Consistent with H1, [VARIABLE 1] was significantly [positively/negatively] correlated with trait aggression, <em>r</em>([df]) = [r], <em>p</em> = [p], representing a [weak/moderate/strong] effect (see Figure 1). H2 was also supported: [VARIABLE 2] was significantly correlated with trait aggression, <em>r</em>([df]) = [r], <em>p</em> = [p] (see Figure 2)."</p>' +

    '<h3 class="guide-h">Tables &amp; Figures</h3>' +
    '<div class="guide-body">' +
    '<ul>' +
    '<li><strong>Tables</strong> are good for a large number of values &mdash; descriptives, correlation matrices, regression results.</li>' +
    '<li><strong>Figures</strong> are often used to highlight your data\u2019s strongest result.</li>' +
    '<li>Reference every table/figure in the text, but they typically live at the end of the paper (after References). Number consecutively in the order referenced (Table 1, Table 2&hellip;; Figure 1, Figure 2&hellip; &mdash; separate numbering systems).</li>' +
    '<li>If a value appears in a table or figure, don\u2019t repeat that same number in the text &mdash; describe the pattern and point the reader to it.</li>' +
    '<li>Don\u2019t include a table or figure just to have one &mdash; it must simplify or clarify, not decorate.</li>' +
    '</ul>' +
    '<table><thead><tr><th>Figure Element</th><th>Format</th><th>Example</th></tr></thead><tbody>' +
    '<tr><td>Figure label</td><td>Bold, flush left. "Figure" + number, no period after.</td><td><strong>Figure 1</strong></td></tr>' +
    '<tr><td>Figure title</td><td>Italicized, flush left, line below the label. Title case, ends with a period.</td><td><em>Scatterplot of the Relationship Between Moral Disengagement and Trait Aggression.</em></td></tr>' +
    '<tr><td>Figure note (optional)</td><td>Begins with italicized "Note." then plain text \u2014 abbreviations, sample size, context.</td><td><em>Note.</em> BPAQ = Buss-Perry Aggression Questionnaire. <em>N</em> = 124.</td></tr>' +
    '</tbody></table>' +
    '</div>' +

    '<h3 class="guide-h">Worked Example</h3>' +
    '<div class="guide-body"><p>Based on a hypothetical moral disengagement study &mdash; not your variable set. Use it as a model for structure, tone, and notation. Don\u2019t copy it.</p></div>' +
    '<div class="annotated-example"><p>Consistent with H1, a Pearson\u2019s correlation revealed a significant, positive, moderate relationship between moral disengagement and trait aggression, <em>r</em>(142) = .41, <em>p</em> &lt; .001. The relationship is illustrated in Figure 1.</p></div>' +
    '<div class="tip-box">\uD83D\uDCCC <strong>What to notice:</strong> The example goes straight to the correlation &mdash; reliability and descriptive statistics already live in the Measures subsection of Method and don\u2019t need to repeat here. It states the hypothesis label, reports the statistics, interprets the effect size, and refers to the figure, all in two sentences.</div>' +

    '<div class="warn-box">\u26A0\uFE0F <strong>Don\u2019t paste Jamovi output into your paper.</strong> Screenshots, tables, and raw software output don\u2019t belong in your Results section \u2014 use them to extract the numbers you need, then report those numbers in your own APA-formatted sentences.</div>';
}

function renderGuideDiscussion(container) {
  container.innerHTML = "" +
    '<p style="line-height:1.6;">The Discussion interprets your findings in plain language, connects them back to the hypotheses and literature from your Introduction, honestly evaluates your study\u2019s limitations, and tells the reader why the study matters. It has three primary goals: <strong>summarizing your results</strong>, <strong>evaluating your study</strong>, and <strong>discussing future work</strong> \u2014 ending with a take-home <strong>conclusion</strong>.</p>' +

    '<div class="callout-box req-table"><strong>Quick reference \u2014 Evaluating Validity in Your Correlational Study (Assignment 9):</strong>' +
    '<table><tbody>' +
    '<tr><td><strong>Part 1</strong></td><td>Discussion opening draft (150&ndash;250 words) &mdash; interpret findings, connect to past research</td></tr>' +
    '<tr><td><strong>Part 2</strong></td><td>Evaluate your study across the four validities &mdash; bullet points or short answers</td></tr>' +
    '<tr><td><strong>Part 3</strong></td><td>Synthesize strengths, limitations, and future directions (200&ndash;250 words)</td></tr>' +
    '</tbody></table></div>' +

    '<h3 class="guide-h">Summarizing Your Results</h3>' +
    '<div class="guide-body"><ul>' +
    '<li>Briefly restate your hypotheses and what you found</li>' +
    '<li>Describe your results in <strong>real-people words</strong> &mdash; no statistics, no jargon</li>' +
    '<li>Clearly state which results supported (and which did not support) each hypothesis</li>' +
    '<li>Address any unexpected or unexplained findings</li>' +
    '<li>Tie your results back to the Introduction: are they consistent or inconsistent with previous work? Do they support the broader theory your hypotheses were based on?</li>' +
    '</ul></div>' +
    '<div class="warn-box">\u26A0\uFE0F <strong>No new statistics.</strong> Numbers and statistical tests belong in the Results section. The Discussion interprets what those numbers mean \u2014 it doesn\u2019t introduce new ones.</div>' +
    '<div class="tip-box">\uD83D\uDCCC <strong>Interpret, don\u2019t repeat:</strong> A common mistake is restating what the Results section already said. The Discussion should add something new \u2014 interpretation, context, meaning \u2014 not just repeat the statistics in sentence form.</div>' +

    '<div class="two-col">' +
    '<div class="example-card weak"><span class="ex-label">Restates Results (avoid this)</span>The correlation between gender bias and academic ratings was not significant, r(40) = -.14, p = .39.</div>' +
    '<div class="example-card good"><span class="ex-label">Interprets (aim for this)</span>Contrary to expectations, individuals\u2019 gender bias did not meaningfully shape how they rated men\u2019s and women\u2019s academic ability \u2014 suggesting that broad attitude measures like this one may not translate into differential judgments in this sample.</div>' +
    '</div>' +

    '<h3 class="guide-h">Evaluating Your Study: The Four Validities</h3>' +
    '<div class="guide-body"><p>Explain the extent to which your study fulfilled each validity, one by one:</p>' +
    '<table><thead><tr><th>Validity</th><th>Guiding Questions</th></tr></thead><tbody>' +
    '<tr><td><strong>Construct</strong></td><td>What were you trying to measure? How well did your measure capture it? What evidence supports this (e.g., the scale\u2019s validation history, the alpha you found)?</td></tr>' +
    '<tr><td><strong>Internal</strong></td><td>Can you make a causal claim? Why or why not? What third variables (confounds) might explain the relationship you found?</td></tr>' +
    '<tr><td><strong>Statistical</strong></td><td>Was your analysis appropriate? Was your sample large enough? What was your effect size, and what does it tell you beyond significance? Any concerns like outliers or restricted range?</td></tr>' +
    '<tr><td><strong>External</strong></td><td>Are your results generalizable? Who were your participants, and what sampling method did you use? Would you expect the same results elsewhere?</td></tr>' +
    '</tbody></table></div>' +
    '<div class="warn-box">\u26A0\uFE0F <strong>Be specific.</strong> Use your actual data (your alpha values, your r, your sample) rather than generic statements that could apply to any study \u2014 those receive partial credit at best.</div>' +

    '<div class="two-col">' +
    '<div class="example-card weak"><span class="ex-label">Generic limitation (avoid this)</span>The sample size could be larger, and a more diverse sample would be better.</div>' +
    '<div class="example-card good"><span class="ex-label">Specific limitation (aim for this)</span>The relatively small sample (N = 83) may have limited statistical power to detect a small-to-moderate effect, particularly given the modest reliability of the gender bias measure (\u03b1 = .57).</div>' +
    '</div>' +

    '<h3 class="guide-h">Future Research</h3>' +
    '<div class="guide-body"><p>Suggest a specific, theory-driven direction \u2014 not just "more research is needed."</p>' +
    '<ul>' +
    '<li>How might a future study correct the flaws of this one?</li>' +
    '<li>What part of the theory should be tested next, and how? What would you expect to find, and what would that mean?</li>' +
    '<li>If your study was correlational, could a future study test it experimentally?</li>' +
    '<li>What about a conceptual replication in a new context \u2014 what would you expect to happen there?</li>' +
    '<li>If you suspect external validity threats, how might results look in a different population? What would that suggest about the theory?</li>' +
    '</ul></div>' +

    '<h3 class="guide-h">Conclusion: The Take-Home Message</h3>' +
    '<div class="guide-body"><p>Wrap up with a clear take-home message:</p>' +
    '<ul>' +
    '<li>Why is this work important?</li>' +
    '<li>What are the real-world implications?</li>' +
    '<li>What did we learn?</li>' +
    '</ul>' +
    '<p style="font-size:13px; color:#666;">Keep the conclusion anchored to what your study actually found (or didn\u2019t find) \u2014 it\u2019s tempting to end on sweeping general statements about the topic, but the strongest conclusions tie the big-picture importance directly back to your specific results.</p>' +
    '</div>' +

    '<div class="tip-box">\uD83D\uDCCC <strong>Proved vs. supported (same rule as Results):</strong> Never say your results "proved" or "disproved" your theory. A non-significant result doesn\u2019t mean a relationship doesn\u2019t exist \u2014 only that this particular study didn\u2019t detect it. There are typically two explanations when results don\u2019t support a theory: the theory needs modification, or the study itself had a flaw \u2014 your validity evaluation is where you reason through which explanation fits.</div>';
}

    '<tr><td><strong>Due date</strong></td><td>Centered, not bold, final line. Write out the full date.</td></tr>' +

    '</div>' +

    '<h3 class="guide-h">The Abstract</h3>' +

    '<h3 class="guide-h">The Four Components</h3>' +

    '<h3 class="guide-h">Worked Example</h3>' +
    '<div class="guide-body"><p>A complete abstract for a hypothetical moral disengagement study &mdash; not your topic. Read it as a model for structure, tone, and what to include (and exclude).</p></div>' +

    '<div class="tip-box">\uD83D\uDCCC <strong>Write the abstract last.</strong> Start with the title page, then draft the abstract only after reviewing your Introduction, Method, Results, and Discussion drafts. Trying to write it before the paper is clear in your own mind usually produces vague, generic results \u2014 and if you struggle to summarize your study in 200 words, that can signal a part of the paper still needs clarifying.</div>';

  } else {
    const disclaimer = document.createElement("div");
    disclaimer.className = "tip-box";
    disclaimer.innerHTML = "\uD83D\uDCCC These comments aren\u2019t meant to imply this paper should be flawless \u2014 no student paper needs to be perfect. They\u2019re my notes on what would move this specific paper closer to that standard, so you can see the kind of feedback a strong revision responds to.";
    container.appendChild(disclaimer);

    const legend = document.createElement("div");
    legend.className = "legend";
    let legendHtml = goals.map(g =>
      '<span class="legend-chip" data-pen="' + g.key + '" style="cursor:default;"><span class="swatch" style="background:var(--' + g.key + ');"></span>' + g.label + '</span>'
    ).join("");
    legendHtml += '<span class="legend-chip" style="cursor:default;"><span class="swatch" style="background:var(--flag);"></span>Area to Improve</span>';
    legendHtml += '<span class="legend-chip" style="cursor:default;"><span class="swatch" style="background:var(--comment);"></span>General Note</span>';
    legend.innerHTML = legendHtml;
    container.appendChild(legend);
  }

  const paperWrap = document.createElement("div");
  paperWrap.className = "paper-wrap";
  let html = '<div class="paper-title">' + paper.title + '</div>';

  blocks.forEach((block, bIdx) => {
    if (block.type === "heading") {
      const cls = block.level === 2 ? "paper-h2" : "paper-h3";
      html += '<div class="' + cls + '">' + block.text + '</div>';
    } else {
      html += '<p class="paper-para">';
      block.sentences.forEach((sentence, sIdx) => {
        const key = bIdx + "-" + sIdx;
        html += '<span class="sent" data-key="' + key + '">' + sentence + '</span> ';
      });
      html += '</p>';
    }
  });
  paperWrap.innerHTML = html;
  container.appendChild(paperWrap);

  const resetRow = document.createElement("div");
  resetRow.className = "reset-row";
  if (currentView === "mine") {
    const resetBtn = document.createElement("button");
    resetBtn.textContent = "Clear all my highlights for this section";
    resetBtn.addEventListener("click", () => {
      if (confirm("Clear all your highlights and notes for this section?")) {
        const prefix = annotationKey + "_";
        Object.keys(myAnnotations).forEach(k => { if (k.indexOf(prefix) === 0) delete myAnnotations[k]; });
        saveMine();
        renderApp();
      }
    });
    resetRow.appendChild(resetBtn);
  }
  container.appendChild(resetRow);

  applyAnnotations(paperWrap, blocks, annotationKey, goals);
}

function applyAnnotations(paperWrap, blocks, annotationKey, goals) {
  const goalLabels = {};
  goals.forEach(g => { goalLabels[g.key] = g.label; });

  const spans = paperWrap.querySelectorAll(".sent");
  spans.forEach(span => {
    const key = span.getAttribute("data-key");
    if (currentView === "mine") {
      const storeKey = annotationKey + "_" + key;
      const data = myAnnotations[storeKey];
      if (data && data.pen && data.pen !== "eraser") {
        span.classList.add("pen-" + data.pen);
        const wrap = document.createElement("span");
        wrap.className = "note-box n-" + data.pen;
        const label = data.pen === "flag" ? "What would you change here, and why?" : "Why does this show \u201c" + goalLabels[data.pen] + "\u201d?";
        wrap.innerHTML = '<label style="display:block; margin-bottom:4px;">' + label + '</label>' +
          '<textarea class="note-input" data-notekey="' + storeKey + '" placeholder="Type your explanation...">' + (data.note || "") + '</textarea><br>' +
          '<button class="note-save-btn" data-savekey="' + storeKey + '" data-savepen="' + data.pen + '">Save note</button>' +
          '<button class="note-save-btn" data-removekey="' + storeKey + '" style="background:#888; margin-left:6px;">Remove highlight</button>';
        span.insertAdjacentElement("afterend", wrap);
      }
      span.addEventListener("click", () => handleMyClick(key, span, annotationKey));
    } else {
      const dataArr = INSTRUCTOR_ANNOTATIONS[annotationKey] ? INSTRUCTOR_ANNOTATIONS[annotationKey][key] : null;
      if (dataArr && dataArr.length) {
        span.classList.add("pen-" + dataArr[0].pen);
        span.style.cursor = "default";
        let insertAfter = span;
        dataArr.forEach(data => {
          const note = document.createElement("span");
          note.className = "note-box n-" + data.pen;
          const tagLabel = data.pen === "flag" ? "Area to Improve" : data.pen === "comment" ? "General Note" : goalLabels[data.pen];
          const strong = document.createElement("strong");
          strong.textContent = tagLabel + ": ";
          note.appendChild(strong);
          note.appendChild(document.createTextNode(data.note));
          insertAfter.insertAdjacentElement("afterend", note);
          insertAfter = note;
        });
      } else {
        span.style.cursor = "default";
      }
    }
  });

  if (currentView === "mine") {
    paperWrap.querySelectorAll("[data-savekey]").forEach(btn => {
      btn.addEventListener("click", () => {
        const storeKey = btn.getAttribute("data-savekey");
        const pen = btn.getAttribute("data-savepen");
        const ta = paperWrap.querySelector('.note-input[data-notekey="' + storeKey + '"]');
        myAnnotations[storeKey] = { pen: pen, note: ta ? ta.value : "" };
        saveMine();
        renderApp();
      });
    });
    paperWrap.querySelectorAll("[data-removekey]").forEach(btn => {
      btn.addEventListener("click", () => {
        const storeKey = btn.getAttribute("data-removekey");
        delete myAnnotations[storeKey];
        saveMine();
        renderApp();
      });
    });
  }
}

function handleMyClick(key, span, annotationKey) {
  const storeKey = annotationKey + "_" + key;

  if (currentPen === "eraser") {
    delete myAnnotations[storeKey];
    saveMine();
    renderApp();
    return;
  }

  const existing = myAnnotations[storeKey];
  if (existing && existing.pen === currentPen) {
    return;
  }

  myAnnotations[storeKey] = { pen: currentPen, note: "" };
  saveMine();
  renderApp();
}

function renderAssignment(container) {
  const sectionLabel = SECTIONS[currentSection].label;
  const goals = GOALS[currentSection];
  const answers = getAssignmentAnswers();

  let html = "";
  html += '<div class="intro"><p>This is the ' + SECTIONS[currentSection].assignmentTitle + ' workflow: review the materials, respond to the prompts below, and use the <strong>Annotation Practice</strong> tab to complete Part 2. When you\u2019re done, export your responses at the bottom of this page and submit them on Canvas.</p></div>';

  html += '<div class="assign-field">';
  html += '<label>Your Name</label>';
  html += '<input type="text" id="assign-name" value="' + escapeAttr(answers.name) + '" placeholder="First and last name">';
  html += '</div>';

  html += '<h3 class="guide-h"><span class="step-num">1</span>Understanding the ' + sectionLabel + '</h3>';
  html += '<div class="assign-field">';
  html += '<div class="hint">Provide one specific question you still have about writing the ' + sectionLabel + ' section.</div>';
  html += '<textarea id="assign-q1">' + escapeHtml(answers.q1) + '</textarea>';
  html += '</div>';

  html += '<h3 class="guide-h"><span class="step-num">2</span>Find It in Action</h3>';
  html += '<div class="assign-field">';
  html += '<div class="hint">Go to the <strong>Annotation Practice</strong> tab. Choose at least 3 of the ' + goals.length + ' goal colors, click the sentence(s) in Hawk RR1 that show the author meeting that goal, and write one sentence explaining why for each. Your progress below updates automatically as you highlight.</div>';
  html += renderProgressSummary();
  html += '</div>';

  html += '<h3 class="guide-h"><span class="step-num">3</span>One Area for Improvement</h3>';
  html += '<div class="assign-field">';
  html += '<div class="hint">In the Annotation Practice tab, use the <strong>Flag for Improvement</strong> tool on at least one sentence and explain what you\u2019d change and why. (You can flag more than one if you like.)</div>';
  html += '</div>';

  html += '<h3 class="guide-h"><span class="step-num">4</span>Reflection</h3>';
  html += '<div class="assign-field">';
  html += '<div class="hint">Briefly explain one thing you learned from the materials that you can apply to your own writing.</div>';
  html += '<textarea id="assign-q3">' + escapeHtml(answers.q3) + '</textarea>';
  html += '</div>';

  html += '<h3 class="guide-h">Submit</h3>';
  html += '<p style="line-height:1.6; font-size:14px;">Export your responses below, then upload the file (or copy/paste the text) into the Canvas assignment.</p>';
  html += '<div class="export-row">';
  html += '<button class="export-btn" id="download-btn">Download my responses (.txt)</button>';
  html += '<button class="export-btn secondary" id="copy-btn">Copy to clipboard</button>';
  html += '</div>';
  html += '<div class="export-confirm" id="export-confirm"></div>';

  container.innerHTML = html;

  document.getElementById("assign-name").addEventListener("input", (e) => saveAssignmentField("name", e.target.value));
  document.getElementById("assign-q1").addEventListener("input", (e) => saveAssignmentField("q1", e.target.value));
  document.getElementById("assign-q3").addEventListener("input", (e) => saveAssignmentField("q3", e.target.value));
  document.getElementById("download-btn").addEventListener("click", downloadResponses);
  document.getElementById("copy-btn").addEventListener("click", copyResponses);
}

function assignmentAnswersKey() { return "apaAssignmentAnswers_" + currentSection; }

function getAssignmentAnswers() {
  let a = {};
  try { a = JSON.parse(localStorage.getItem(assignmentAnswersKey())) || {}; } catch (e) { a = {}; }
  return { name: a.name || "", q1: a.q1 || "", q3: a.q3 || "" };
}

function saveAssignmentField(field, value) {
  const a = getAssignmentAnswers();
  a[field] = value;
  localStorage.setItem(assignmentAnswersKey(), JSON.stringify(a));
}

function getGoalHighlights() {
  const goals = GOALS[currentSection];
  const blocks = PAPER.hawkRR1[currentSection];
  const annotationKey = "hawkRR1_" + currentSection;
  const goalKeys = goals.map(g => g.key);
  const found = { byGoal: {}, flags: [] };
  goalKeys.forEach(k => { found.byGoal[k] = []; });

  Object.keys(myAnnotations).forEach(storeKey => {
    const prefix = annotationKey + "_";
    if (storeKey.indexOf(prefix) !== 0) return;
    const key = storeKey.slice(prefix.length);
    const parts = key.split("-").map(Number);
    const b = parts[0], s = parts[1];
    const block = blocks[b];
    if (!block || block.type !== "para") return;
    const sentence = block.sentences[s];
    const data = myAnnotations[storeKey];
    if (data.pen === "flag") {
      found.flags.push({ sentence: sentence, note: data.note });
    } else if (goalKeys.indexOf(data.pen) !== -1) {
      found.byGoal[data.pen].push({ sentence: sentence, note: data.note });
    }
  });
  return found;
}

function renderProgressSummary() {
  const goals = GOALS[currentSection];
  const found = getGoalHighlights();
  const goalsCovered = goals.filter(g => found.byGoal[g.key].length > 0).length;
  let html = '<div class="progress-summary">';
  html += '<strong>' + goalsCovered + ' of ' + goals.length + ' goals highlighted</strong> (need at least 3) &middot; <strong>' + found.flags.length + ' area(s) for improvement flagged</strong> (need at least 1)';
  html += '</div>';
  return html;
}

function escapeHtml(s) {
  return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function escapeAttr(s) {
  return (s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;");
}

function buildResponseText() {
  const answers = getAssignmentAnswers();
  const found = getGoalHighlights();
  const goals = GOALS[currentSection];
  const sectionLabel = SECTIONS[currentSection].label;

  let out = "";
  out += "APA STYLE: THE " + sectionLabel.toUpperCase() + " SECTION\n";
  out += "Name: " + (answers.name || "[not entered]") + "\n";
  out += "============================================================\n\n";

  out += "1. UNDERSTANDING THE " + sectionLabel.toUpperCase() + "\n";
  out += (answers.q1 || "[no response entered]") + "\n\n";

  out += "2. FIND IT IN ACTION\n\n";
  let anyGoal = false;
  goals.forEach(g => {
    const items = found.byGoal[g.key];
    if (items.length === 0) return;
    anyGoal = true;
    out += "Goal: " + g.label + "\n";
    items.forEach(item => {
      out += '  Sentence: "' + item.sentence + '"\n';
      out += "  Why it works: " + (item.note || "[no explanation entered]") + "\n\n";
    });
  });
  if (!anyGoal) {
    out += "[No goals highlighted yet \u2014 go to the Annotation Practice tab to complete this section]\n\n";
  }

  out += "3. ONE AREA FOR IMPROVEMENT\n\n";
  if (found.flags.length === 0) {
    out += "[No areas flagged yet \u2014 go to the Annotation Practice tab to complete this section]\n\n";
  } else {
    found.flags.forEach(item => {
      out += '  Sentence: "' + item.sentence + '"\n';
      out += "  Suggested improvement: " + (item.note || "[no explanation entered]") + "\n\n";
    });
  }

  out += "4. REFLECTION\n";
  out += (answers.q3 || "[no response entered]") + "\n";

  return out;
}

function downloadResponses() {
  const text = buildResponseText();
  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const answers = getAssignmentAnswers();
  const nameSlug = (answers.name || "student").replace(/[^a-z0-9]/gi, "_");
  a.href = url;
  a.download = nameSlug + "_" + SECTIONS[currentSection].label + "_Assignment.txt";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  markExported();
  showExportConfirm("Downloaded! Upload this file to the Canvas assignment. Dr. Reich's Highlights are now unlocked.");
}

function copyResponses() {
  const text = buildResponseText();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      markExported();
      showExportConfirm("Copied! Paste this into the Canvas text entry box. Dr. Reich's Highlights are now unlocked.");
    }).catch(() => {
      showExportConfirm("Couldn't copy automatically \u2014 try the Download option instead.");
    });
  } else {
    showExportConfirm("Copy isn't supported in this browser \u2014 try the Download option instead.");
  }
}

function markExported() {
  localStorage.setItem("apa" + currentSection + "Exported", "true");
}

function hasExported() {
  return localStorage.getItem("apa" + currentSection + "Exported") === "true";
}

function isInstructorViewUnlocked() {
  const hasAssignmentTab = !!SECTIONS[currentSection].assignmentTitle;
  if (hasAssignmentTab) {
    // Locked until the student exports their responses \u2014 no date-based fallback.
    return hasExported();
  }
  // No export mechanism exists for this section, so highlights are always visible.
  return true;
}

function showExportConfirm(msg) {
  const el = document.getElementById("export-confirm");
  if (!el) return;
  el.textContent = "\u2713 " + msg;
  el.style.display = "block";
}

renderApp();
</script>
